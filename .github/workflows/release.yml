name: Release

# Push a tag like `v0.1.0` (or run this workflow manually) to build release
# binaries and attach them to a GitHub Release. The Homebrew formula in the
# kmtym1998/homebrew-tap repository downloads these tarballs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Mac (native build)
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel Mac (cross-built on the Apple Silicon runner)
          - os: macos-14
            target: x86_64-apple-darwin
          # Linux (for Linuxbrew / direct download)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libasound2-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev

      - name: Install Rust (stable) with target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          NAME="eren-${VERSION}-${{ matrix.target }}"
          mkdir -p dist-pkg
          cp "target/${{ matrix.target }}/release/eren" dist-pkg/
          cp README.md LICENSE dist-pkg/
          # Files sit at the tarball root so the Homebrew formula can
          # `bin.install "eren"` directly.
          tar -czf "${NAME}.tar.gz" -C dist-pkg eren README.md LICENSE
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -la "${NAME}.tar.gz"*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eren-*.tar.gz
            eren-*.tar.gz.sha256

      - name: Upload as workflow artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: eren-${{ matrix.target }}
          path: |
            eren-*.tar.gz
            eren-*.tar.gz.sha256
