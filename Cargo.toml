[package]
name = "eren"
version = "0.1.0"
edition = "2021"
description = "A native workspace for coding agents with terminal sessions, file editing, LSP navigation, search, and Git diffs."
license = "MIT"

[dependencies]
gpui-kit = { version = "0.9", features = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-python",
] }
alacritty_terminal = "0.25"
ignore = "0.4"
serde_json = "1"
lsp-types = { version = "0.97", features = ["proposed"] }
anyhow = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
