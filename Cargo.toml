[package]
name = "eren"
version = "0.1.0"
edition = "2021"
description = "A Sirio/Herdr-like native workspace for coding agents: project sidebar, code viewer with LSP jumps, diffs and (later) terminals."
license = "MIT"

[dependencies]
gpui-kit = { version = "0.9", features = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-python",
] }
